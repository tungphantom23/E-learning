spring.application.name=QLhoctap

# =============================================================================
# DATABASE - PostgreSQL
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/Qlhoctap
spring.datasource.username=postgres
spring.datasource.password=2306
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA / HIBERNATE
# Dùng 'none' vì Flyway là nguồn quản lý schema duy nhất
# Hibernate KHÔNG cần validate hay tự sửa DB - Flyway đã lo
# =============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database hiện hữu đã có schema nền; Flyway tiếp tục từ migration V2.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# =============================================================================
# SQL INIT - Chạy schema khi khởi động (chỉ chạy khi bảng chưa tồn tại)
# =============================================================================
spring.sql.init.mode=never

# =============================================================================
# JWT Security
# =============================================================================
application.security.jwt.secret-key=dGhpcy1pcy1hLXZlcnktc2VjdXJlLWp3dC1zZWNyZXQta2V5LWZvci1xbC1ob2MtdGFwLWFwcGxpY2F0aW9u
application.security.jwt.expiration-ms=86400000

# =============================================================================
# FILE UPLOAD - Cho phép upload file UML (ảnh/PDF) lên đến 50MB
# =============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Change server port to avoid conflicts during development
server.port=8081

